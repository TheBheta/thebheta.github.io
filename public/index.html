<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Chinmay Govind - now at cgovind.com</title>

    <!--
      This site has moved to https://cgovind.com and this page exists only to
      send people and search engines there.

      Why it is worth a page rather than a deletion: in August 2026 searching
      "Chinmay Govind" returned *this* address and not cgovind.com, which was not
      indexed at all. The old site was ranking in the new one's place, and taking
      it down would have thrown that standing away rather than handing it over.

      GitHub Pages cannot serve a 301, so this is the strongest signal available:
      a canonical naming the new address, a zero-delay meta refresh (which Google
      treats as a redirect), and a script that moves immediately. `replace`
      rather than `href` so the Back button does not bounce off this page.

      **Do not add a robots.txt rule that blocks this page.** A crawler that
      cannot fetch it cannot see the redirect either, and the old page would stay
      in the index forever. The deep paths are disallowed in robots.txt; the root
      deliberately is not.
    -->
    <link rel="canonical" href="https://cgovind.com/" />
    <meta http-equiv="refresh" content="0; url=https://cgovind.com/" />
    <meta name="description" content="Chinmay Govind's website has moved to cgovind.com." />

    <style>
      html, body { margin: 0; height: 100%; background: #fff; color: #000; }
      body {
        display: flex; align-items: center; justify-content: center;
        font-family: "Comic Sans MS", system-ui, sans-serif; text-align: center;
        padding: 1.5rem;
      }
      h1 { font-size: 1.6rem; font-weight: 700; margin: 0 0 .6rem; }
      p { margin: 0; font-size: 1.05rem; }
      a { color: #1a56ff; }
    </style>
  </head>
  <body>
    <!-- Seen only if both the refresh and the script are unavailable, which in
         practice means a text browser or a crawler that renders nothing. It
         still has to say where to go. -->
    <main>
      <h1>this site has moved</h1>
      <p>
        Chinmay's website is now at
        <a href="https://cgovind.com/">cgovind.com</a>.
      </p>
    </main>
    <script>
      window.location.replace("https://cgovind.com/");
    </script>
  </body>
</html>
