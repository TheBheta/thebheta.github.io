<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Chinmay Govind - now at cgovind.com</title>

    <!--
      GitHub Pages serves this for any path it cannot find, so it is what a stale
      deep link into the old site lands on. It goes to the new site's front door
      rather than trying to translate the path: most of the old tree was migrated
      into cgovind.com under the same names, but not all of it and not exactly,
      so a guessed path would sometimes be a second 404 with nothing to say.

      No canonical here. This page stands for every address that does not exist,
      and telling a search engine that all of them are cgovind.com's home page is
      a claim about pages that were never real. The redirect is the whole job.
    -->
    <meta http-equiv="refresh" content="0; url=https://cgovind.com/" />
    <meta name="robots" content="noindex" />

    <style>
      html, body { margin: 0; height: 100%; background: #fff; color: #000; }
      body {
        display: flex; align-items: center; justify-content: center;
        font-family: "Comic Sans MS", system-ui, sans-serif; text-align: center;
        padding: 1.5rem;
      }
      h1 { font-size: 1.6rem; font-weight: 700; margin: 0 0 .6rem; }
      p { margin: 0; font-size: 1.05rem; }
      a { color: #1a56ff; }
    </style>
  </head>
  <body>
    <main>
      <h1>this site has moved</h1>
      <p>
        Chinmay's website is now at
        <a href="https://cgovind.com/">cgovind.com</a>.
      </p>
    </main>
    <script>
      window.location.replace("https://cgovind.com/");
    </script>
  </body>
</html>
